<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEPAN - Falling Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050a12;
            color: #e5e7eb;
            font-family: 'Tahoma', Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #070c15;
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
        }
        
        /* HEADER */
        .header {
            background: #0d1422;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            font-weight: bold;
        }
        .header .stats span {
            background: #1a2a3d;
            padding: 4px 14px;
            border-radius: 8px;
        }
        .header .stats .score { color: #38bdf8; }
        .header .stats .combo { color: #fbbf24; }
        .header .stats .accuracy { color: #2dd4bf; }
        
        /* LESSONS */
        .lessons {
            padding: 20px;
        }
        .lesson-card {
            background: #0d1422;
            border: 1px solid #1c2a3d;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .lesson-card:hover {
            border-color: #38bdf8;
            transform: translateX(-5px);
        }
        .lesson-card .info h3 { font-size: 15px; }
        .lesson-card .info p { font-size: 13px; color: #94a3b8; }
        .lesson-card .level { font-size: 11px; color: #38bdf8; }
        .lesson-card.locked { opacity: 0.4; cursor: not-allowed; }
        .lesson-card.completed { border-color: #2dd4bf; }
        
        /* PRACTICE */
        .practice {
            display: none;
        }
        .practice-header {
            background: #0d1422;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .practice-header .back {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 22px;
            cursor: pointer;
        }
        .practice-header .title { font-size: 18px; font-weight: bold; }
        .practice-header .pstats { display: flex; gap: 12px; font-size: 13px; font-weight: bold; }
        .practice-header .pstats span { background: #1a2a3d; padding: 3px 12px; border-radius: 6px; }
        
        .next-note {
            text-align: center;
            padding: 8px 0;
            font-size: 11px;
            color: #475569;
        }
        .next-note .note {
            font-size: 34px;
            font-weight: bold;
            color: #38bdf8;
        }
        
        .falling-area {
            background: #09111e;
            border: 1px solid #1c2a3d;
            border-radius: 14px;
            margin: 5px 15px;
            padding: 5px;
        }
        #fallingCanvas {
            width: 100%;
            height: auto;
            background: #09111e;
            display: block;
            border-radius: 10px;
        }
        
        .handpan-area {
            background: #0b1320;
            border: 1px solid #1c2a3d;
            border-radius: 14px;
            margin: 5px 15px;
            padding: 5px;
        }
        #handpanCanvas {
            width: 100%;
            height: auto;
            background: #0b1320;
            display: block;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            padding: 8px 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .controls button {
            background: #0d1422;
            border: 1px solid #1c2a3d;
            color: #e5e7eb;
            padding: 5px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .controls button:hover { border-color: #38bdf8; }
        .controls select {
            background: #0d1422;
            color: #e5e7eb;
            border: 1px solid #1c2a3d;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .controls .progress { color: #475569; font-size: 13px; margin-right: auto; }
        
        .result {
            background: #0d1a2a;
            border: 2px solid #2dd4bf;
            border-radius: 14px;
            padding: 20px;
            margin: 10px 15px;
            text-align: center;
            display: none;
        }
        .result .big-score { font-size: 48px; font-weight: 800; color: #2dd4bf; }
        .result .bar { height: 6px; background: #0d1422; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .result .bar .fill { height: 100%; background: linear-gradient(90deg, #f472b6, #2dd4bf); transition: width 1s; }
        .result .msg { color: #94a3b8; margin: 8px 0; }
        .result .actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
        .result .actions button {
            padding: 8px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .result .actions .retry { background: #1a2a3d; color: #e5e7eb; border: 1px solid #1c2a3d; }
        .result .actions .next { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #000; }
        
        /* RECORD BUTTON */
        .record-btn {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            color: #000;
            padding: 8px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 15px;
        }
        .record-btn.recording {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .record-status { color: #94a3b8; font-size: 13px; margin: 5px 15px; }
        
        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 10px; text-align: center; }
            .header .stats { flex-wrap: wrap; justify-content: center; }
            .practice-header { flex-direction: column; gap: 8px; text-align: center; }
            .practice-header .pstats { flex-wrap: wrap; justify-content: center; }
            .controls { justify-content: center; }
            .controls .progress { margin-right: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- HOME -->
    <div id="homePage">
        <div class="header">
            <h1>🥁 WEPAN</h1>
            <div class="stats">
                <span class="score">🏆 <span id="totalLessons">0</span></span>
                <span class="combo">✅ <span id="completedLessons">0</span></span>
                <span class="accuracy">🔥 <span id="streakCount">0</span></span>
            </div>
        </div>
        <div class="lessons" id="lessonsContainer"></div>
    </div>
    
    <!-- PRACTICE -->
    <div id="practicePage" class="practice">
        <div class="practice-header">
            <button class="back" id="backButton">←</button>
            <span class="title" id="lessonTitle">درس</span>
            <div class="pstats">
                <span class="score" id="scoreDisplay">SCORE 0</span>
                <span class="combo" id="comboDisplay">COMBO 0</span>
                <span class="accuracy" id="accuracyDisplay">ACC 0%</span>
            </div>
        </div>
        
        <div class="next-note">
            <span style="color:#475569;">NEXT NOTE</span>
            <div class="note" id="targetNote">—</div>
        </div>
        
        <div class="falling-area">
            <canvas id="fallingCanvas" width="820" height="315"></canvas>
        </div>
        
        <div class="handpan-area">
            <canvas id="handpanCanvas" width="820" height="248"></canvas>
        </div>
        
        <div class="controls">
            <button id="pauseButton">⏸ PAUSE</button>
            <span style="color:#475569;font-size:11px;">SPEED</span>
            <select id="speedSelect">
                <option value="0.25">0.25×</option>
                <option value="0.50">0.50×</option>
                <option value="0.75">0.75×</option>
                <option value="1.00" selected>1.00×</option>
                <option value="1.25">1.25×</option>
                <option value="1.50">1.50×</option>
            </select>
            <span class="progress" id="progressLabel">NOTES 0 / 20</span>
        </div>
        
        <button class="record-btn" id="recordButton">🎤 ضبط تمرین</button>
        <div class="record-status" id="recordStatus">برای تمرین ضبط کن</div>
        
        <div class="result" id="resultArea">
            <div class="big-score" id="resultScore">0</div>
            <div style="color:#94a3b8;font-size:14px;">SCORE</div>
            <div class="bar"><div class="fill" id="accuracyFill" style="width:0%;"></div></div>
            <div class="msg" id="resultMessage"></div>
            <div class="actions">
                <button class="retry" id="retryButton">🔄 دوباره</button>
                <button class="next" id="nextButton">درس بعدی →</button>
            </div>
        </div>
    </div>
</div>

<script>
// =========================================================
// WEPAN - FULL GAME
// =========================================================

// ===== DATA =====
const NOTE_X = { "A_high":75, "F":170, "G":265, "E":355, "D":430, "D_high":500, "C":595, "Bb":690, "A":760 };
const NOTE_COLORS = { "C":"#38bdf8", "D":"#60a5fa", "E":"#2dd4bf", "F":"#818cf8", "G":"#a78bfa", "A":"#f472b6", "Bb":"#fbbf24", "A_high":"#fb7185", "D_high":"#34d399" };
const NOTE_LABELS = { "A":"A", "Bb":"Bb", "C":"C", "D_high":"D", "E":"E", "F":"F", "G":"G", "A_high":"A", "D":"D" };
const ALL_NOTES = Object.keys(NOTE_X);

const LESSONS = [
    { id:'1', title:'نت C', desc:'ضربه روی C', level:1, expected:['C'] },
    { id:'2', title:'نت D', desc:'ضربه روی D', level:1, expected:['D'] },
    { id:'3', title:'نت E', desc:'ضربه روی E', level:1, expected:['E'] },
    { id:'4', title:'C و D', desc:'C سپس D', level:2, expected:['C','D'] },
    { id:'5', title:'D و E', desc:'D سپس E', level:2, expected:['D','E'] },
    { id:'6', title:'سه نت', desc:'C-D-E', level:3, expected:['C','D','E'] },
];

const TOTAL_NOTES = 20;

// ===== STATE =====
let currentLesson = null;
let score = 0, hits = 0, misses = 0, combo = 0, bestCombo = 0, notesPlayed = 0;
let isPaused = false, isRecording = false;
let speedMultiplier = 1.0;
let fallingNote = null, currentTarget = null, noteY = 20, hitY = 252;
let animationId = null, lastTime = 0;
let mediaRecorder = null, audioChunks = [];

let completed = JSON.parse(localStorage.getItem('wepan_completed') || '[]');
let streak = parseInt(localStorage.getItem('wepan_streak') || '0');
let lastPractice = localStorage.getItem('wepan_last') || null;

// ===== CANVAS =====
let canvas, ctx, panCanvas, panCtx;

// ===== LESSONS =====
function renderLessons() {
    const container = document.getElementById('lessonsContainer');
    container.innerHTML = LESSONS.map((l, i) => {
        const done = completed.includes(l.id);
        const locked = i > 0 && !completed.includes(LESSONS[i-1].id);
        return `
            <div class="lesson-card ${locked?'locked':''} ${done?'completed':''}" onclick="${locked?'':`startLesson('${l.id}')`}">
                <div class="info"><h3>${l.title}</h3><p>${l.desc}</p><span class="level">سطح ${l.level}</span></div>
                <div>${done?'✅':locked?'🔒':'▶️'}</div>
            </div>
        `;
    }).join('');
    document.getElementById('totalLessons').textContent = LESSONS.length;
    document.getElementById('completedLessons').textContent = completed.length;
    document.getElementById('streakCount').textContent = streak;
}

// ===== START LESSON =====
function startLesson(id) {
    currentLesson = LESSONS.find(l => l.id === id);
    if (!currentLesson) return;
    
    document.getElementById('homePage').style.display = 'none';
    document.getElementById('practicePage').style.display = 'block';
    document.getElementById('lessonTitle').textContent = currentLesson.title;
    
    score = 0; hits = 0; misses = 0; combo = 0; bestCombo = 0; notesPlayed = 0;
    updateStats();
    document.getElementById('progressLabel').textContent = `NOTES 0 / ${TOTAL_NOTES}`;
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('targetNote').textContent = '—';
    document.getElementById('recordStatus').textContent = '🎤 برای تمرین ضبط کن';
    document.getElementById('recordButton').className = 'record-btn';
    
    setupCanvases();
    drawHandpan();
    drawFallingArea();
    spawnNote();
}

function setupCanvases() {
    canvas = document.getElementById('fallingCanvas');
    ctx = canvas.getContext('2d');
    panCanvas = document.getElementById('handpanCanvas');
    panCtx = panCanvas.getContext('2d');
    const resize = () => {
        const w = Math.min(820, canvas.parentElement.clientWidth - 10);
        canvas.style.width = w + 'px';
        canvas.style.height = (w * 315 / 820) + 'px';
        panCanvas.style.width = w + 'px';
        panCanvas.style.height = (w * 248 / 820) + 'px';
    };
    resize();
    window.addEventListener('resize', resize);
}

// ===== DRAW =====
function drawFallingArea() {
    const W=820, H=315;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = '#17283a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(25,15); ctx.lineTo(335,15);
    ctx.moveTo(350,15); ctx.lineTo(510,15);
    ctx.moveTo(525,15); ctx.lineTo(795,15);
    ctx.stroke();
    ctx.fillStyle='#475569'; ctx.font='bold 8px Arial'; ctx.fillText('EVEN',180,27);
    ctx.fillStyle='#60a5fa'; ctx.fillText('D • CENTER',430,27);
    ctx.fillStyle='#475569'; ctx.fillText('ODD',660,27);
    
    ctx.strokeStyle='#1b2b3d'; ctx.lineWidth=1;
    for(let x of Object.values(NOTE_X)) { ctx.beginPath(); ctx.moveTo(x,42); ctx.lineTo(x,267); ctx.stroke(); }
    ctx.strokeStyle='#315270'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(NOTE_X['D'],38); ctx.lineTo(NOTE_X['D'],272); ctx.stroke();
    
    hitY = 252;
    ctx.strokeStyle='#0ea5e9'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(18,hitY); ctx.lineTo(W-18,hitY); ctx.stroke();
    ctx.strokeStyle='#67e8f9'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(18,hitY); ctx.lineTo(W-18,hitY); ctx.stroke();
    
    const nums = [[8,"A_high"],[6,"F"],[7,"G"],[5,"E"],[4,"D_high"],[3,"C"],[2,"Bb"],[1,"A"]];
    ctx.font='bold 10px Arial';
    for(let [n,note] of nums) {
        let x=NOTE_X[note];
        ctx.fillStyle='#94a3b8'; ctx.fillText(n,x-6,hitY-20);
        ctx.fillStyle=NOTE_COLORS[note]; ctx.font='bold 8px Arial';
        ctx.fillText(NOTE_LABELS[note],x-6,hitY+17);
        ctx.font='bold 10px Arial';
    }
    ctx.fillStyle='#60a5fa'; ctx.font='bold 11px Arial';
    ctx.fillText('D',NOTE_X['D']-8,hitY-22);
    ctx.fillStyle=NOTE_COLORS['D']; ctx.font='bold 8px Arial';
    ctx.fillText('D',NOTE_X['D']-4,hitY+17);
    ctx.fillStyle='#67e8f9'; ctx.font='bold 9px Arial';
    ctx.fillText('HIT',W-43,hitY-40);
}

function drawHandpan(highlight=null) {
    const W=820, H=248;
    panCtx.clearRect(0,0,W,H);
    panCtx.strokeStyle='#18273a'; panCtx.lineWidth=2; panCtx.strokeRect(10,10,800,228);
    panCtx.fillStyle='#475569'; panCtx.font='bold 9px Arial'; panCtx.fillText('HANDPAN',38,27);
    
    const cx=430, cy=135, r=100;
    panCtx.shadowColor='#040810'; panCtx.shadowBlur=20;
    panCtx.beginPath(); panCtx.arc(cx,cy,r,0,Math.PI*2);
    panCtx.fillStyle='#293646'; panCtx.fill();
    panCtx.shadowBlur=0;
    panCtx.strokeStyle='#64748b'; panCtx.lineWidth=3; panCtx.stroke();
    panCtx.beginPath(); panCtx.arc(cx,cy,r-7,0,Math.PI*2);
    panCtx.fillStyle='#263342'; panCtx.fill();
    panCtx.strokeStyle='#3f4e61'; panCtx.lineWidth=2; panCtx.stroke();
    
    const pos = { "A":[430,55,18], "Bb":[500,82,18], "C":[530,135,18], "D_high":[500,190,18], "E":[430,215,18], "F":[360,190,18], "G":[330,135,18], "A_high":[360,82,18], "D":[430,135,31] };
    for(let [note,[x,y,r2]] of Object.entries(pos)) {
        let col = NOTE_COLORS[note], hl = highlight===note;
        panCtx.shadowColor='#111923'; panCtx.shadowBlur=10;
        panCtx.beginPath(); panCtx.arc(x,y,r2+2,0,Math.PI*2);
        panCtx.fillStyle='#111923'; panCtx.fill();
        panCtx.shadowBlur=0;
        panCtx.beginPath(); panCtx.arc(x,y,r2,0,Math.PI*2);
        panCtx.fillStyle=hl?'#1a3a5a':'#1d2835';
        panCtx.fill();
        panCtx.strokeStyle=hl?col:'#4a596d';
        panCtx.lineWidth=hl?3:2;
        panCtx.stroke();
        panCtx.beginPath(); panCtx.arc(x,y,r2-4,0,Math.PI*2);
        panCtx.strokeStyle=col; panCtx.lineWidth=1; panCtx.stroke();
        panCtx.fillStyle=hl?col:'#e5e7eb';
        panCtx.font=`bold ${note==='D'?12:9}px Arial`;
        panCtx.textAlign='center'; panCtx.textBaseline='middle';
        panCtx.fillText(NOTE_LABELS[note],x,y);
    }
}

function drawDroplet(x,y,note) {
    let col = NOTE_COLORS[note];
    ctx.fillStyle=col; ctx.globalAlpha=0.3;
    ctx.beginPath();
    ctx.moveTo(x-3,y-31); ctx.quadraticCurveTo(x-8,y-55,x-5,y-70);
    ctx.quadraticCurveTo(x,y-78,x+5,y-70);
    ctx.quadraticCurveTo(x+8,y-55,x+3,y-31);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.shadowColor=col; ctx.shadowBlur=15;
    ctx.beginPath();
    ctx.moveTo(x,y-44);
    ctx.quadraticCurveTo(x+30,y-10,x+32,y+16);
    ctx.quadraticCurveTo(x+30,y+40,x,y+53);
    ctx.quadraticCurveTo(x-30,y+40,x-32,y+16);
    ctx.quadraticCurveTo(x-30,y-10,x,y-44);
    ctx.fillStyle=col; ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=0.5;
    ctx.beginPath();
    ctx.moveTo(x,y-20);
    ctx.quadraticCurveTo(x+15,y-5,x+14,y+10);
    ctx.quadraticCurveTo(x+10,y+25,x,y+28);
    ctx.quadraticCurveTo(x-10,y+25,x-14,y+10);
    ctx.quadraticCurveTo(x-15,y-5,x,y-20);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#06121c'; ctx.font='bold 8px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(NOTE_LABELS[note],x,y+6);
}

// ===== GAME LOOP =====
function spawnNote() {
    if (notesPlayed >= TOTAL_NOTES) { finishPractice(); return; }
    let note = ALL_NOTES[Math.floor(Math.random()*ALL_NOTES.length)];
    currentTarget = note;
    noteY = 20;
    document.getElementById('targetNote').textContent = NOTE_LABELS[note];
    document.getElementById('targetNote').style.color = NOTE_COLORS[note];
    document.getElementById('progressLabel').textContent = `NOTES ${notesPlayed+1} / ${TOTAL_NOTES}`;
    notesPlayed++;
    drawHandpan(note);
    fallingNote = { note, x: NOTE_X[note], y: noteY };
    lastTime = 0;
    animateNote();
}

function animateNote(timestamp) {
    if (!fallingNote) return;
    if (isPaused) { animationId = requestAnimationFrame(animateNote); return; }
    let dt = lastTime ? Math.min((timestamp-lastTime)/1000, 0.04) : 0.016;
    lastTime = timestamp;
    let speed = 235 * speedMultiplier;
    fallingNote.y += speed * dt;
    drawFallingArea();
    drawDroplet(fallingNote.x, fallingNote.y, fallingNote.note);
    if (Math.abs(fallingNote.y - hitY) < 62) {
        let grad = ctx.createRadialGradient(fallingNote.x,fallingNote.y,5,fallingNote.x,fallingNote.y,40);
        grad.addColorStop(0,'rgba(255,255,255,0.2)');
        grad.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(fallingNote.x,fallingNote.y,40,0,Math.PI*2); ctx.fill();
    }
    if (fallingNote.y > hitY + 52) {
        misses++; combo=0; updateStats();
        fallingNote = null;
        setTimeout(spawnNote, 220);
        return;
    }
    animationId = requestAnimationFrame(animateNote);
}

function hitNote(note) {
    if (!fallingNote || isPaused) return;
    if (note !== currentTarget) { combo=0; updateStats(); return; }
    let dist = Math.abs(fallingNote.y - hitY);
    if (dist <= 78) {
        let pts = Math.max(60, 180 - Math.floor(dist * 1.8));
        score += pts + combo * 12;
        hits++; combo++;
        if (combo > bestCombo) bestCombo = combo;
        drawHandpan(note);
        fallingNote = null;
        updateStats();
        if (notesPlayed >= TOTAL_NOTES) setTimeout(finishPractice, 180);
        else setTimeout(spawnNote, 180);
    }
}

function updateStats() {
    document.getElementById('scoreDisplay').textContent = `SCORE ${score}`;
    document.getElementById('comboDisplay').textContent = `COMBO ${combo}`;
    let total = hits + misses;
    let acc = total > 0 ? Math.round((hits/total)*100) : 0;
    document.getElementById('accuracyDisplay').textContent = `ACC ${acc}%`;
}

function finishPractice() {
    if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
    let total = hits + misses;
    let acc = total > 0 ? Math.round((hits/total)*100) : 0;
    let msg = score > 200 ? '🎉 عالی!' : score > 100 ? '💪 خوب!' : '📚 تمرین بیشتر';
    showResult(score, acc, msg);
}

function showResult(sc, acc, msg) {
    document.getElementById('resultArea').style.display = 'block';
    document.getElementById('resultScore').textContent = sc;
    document.getElementById('accuracyFill').style.width = acc + '%';
    document.getElementById('resultMessage').textContent = `${msg} | دقت: ${acc}%`;
    if (currentLesson && !completed.includes(currentLesson.id)) {
        completed.push(currentLesson.id);
        localStorage.setItem('wepan_completed', JSON.stringify(completed));
        let today = new Date().toDateString();
        if (lastPractice === today) { /* same day */ }
        else if (lastPractice === new Date(Date.now()-86400000).toDateString()) { streak++; }
        else { streak = 1; }
        lastPractice = today;
        localStorage.setItem('wepan_streak', streak);
        localStorage.setItem('wepan_last', lastPractice);
        renderLessons();
    }
}

// ===== RECORD =====
document.getElementById('recordButton').addEventListener('click', async function() {
    if (isRecording) { stopRecording(); return; }
    try {
        let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
            let blob = new Blob(audioChunks, { type: 'audio/wav' });
            document.getElementById('recordStatus').textContent = '⏳ تحلیل...';
            let formData = new FormData();
            formData.append('audio', blob, 'rec.wav');
            let res = await fetch('/analyze', { method:'POST', body:formData });
            let data = await res.json();
            if (data.status === 'success') {
                let expected = currentLesson ? currentLesson.expected : [];
                let sr = await fetch('/score', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({expectedNotes:expected, detectedNotes:data.detected_notes||[]})
                });
                let sd = await sr.json();
                showResult(sd.score||0, sd.accuracy||0, sd.message||'');
            } else { alert('❌ خطا'); }
            document.getElementById('recordStatus').textContent = '✅ تحلیل شد';
        };
        mediaRecorder.start();
        isRecording = true;
        this.textContent = '⏹ توقف';
        this.className = 'record-btn recording';
        document.getElementById('recordStatus').textContent = '⏺ در حال ضبط...';
    } catch(e) { alert('❌ دسترسی به میکروفون داده نشد!'); }
});

function stopRecording() {
    if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t=>t.stop());
        isRecording = false;
        document.getElementById('recordButton').textContent = '🎤 ضبط تمرین';
        document.getElementById('recordButton').className = 'record-btn';
    }
}

// ===== CONTROLS =====
document.getElementById('pauseButton').addEventListener('click', function() {
    isPaused = !isPaused;
    this.textContent = isPaused ? '▶ RESUME' : '⏸ PAUSE';
});
document.getElementById('speedSelect').addEventListener('change', function() {
    speedMultiplier = parseFloat(this.value);
});
document.getElementById('backButton').addEventListener('click', function() {
    if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
    if (isRecording) stopRecording();
    document.getElementById('practicePage').style.display = 'none';
    document.getElementById('homePage').style.display = 'block';
});
document.getElementById('retryButton').addEventListener('click', function() {
    if (currentLesson) startLesson(currentLesson.id);
});
document.getElementById('nextButton').addEventListener('click', function() {
    let idx = LESSONS.findIndex(l => l.id === currentLesson.id);
    if (idx < LESSONS.length - 1) startLesson(LESSONS[idx+1].id);
    else { alert('🎉 همه درس‌ها تموم شد!'); document.getElementById('practicePage').style.display='none'; document.getElementById('homePage').style.display='block'; }
});

// ===== CLICK HANDPAN =====
document.getElementById('handpanCanvas').addEventListener('click', function(e) {
    let rect = this.getBoundingClientRect();
    let scaleX = 820/rect.width, scaleY = 248/rect.height;
    let mx = (e.clientX - rect.left)*scaleX, my = (e.clientY - rect.top)*scaleY;
    const pos = { "A":[430,55,18], "Bb":[500,82,18], "C":[530,135,18], "D_high":[500,190,18], "E":[430,215,18], "F":[360,190,18], "G":[330,135,18], "A_high":[360,82,18], "D":[430,135,31] };
    for (let [note,[x,y,r]] of Object.entries(pos)) {
        if (Math.sqrt((mx-x)**2+(my-y)**2) <= r) { hitNote(note); return; }
    }
});

// ===== START =====
renderLessons();
</script>
